<style>

#kb{position:relative;height:100%;display:flex;touch-action:none}

.b i{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:600 9px system-ui;color:#fffa;font-style:normal;pointer-events:none}
.b{position:absolute;top:0;width:32px;height:62%;background:var(--bk);border-radius:0 0 4px 4px;z-index:2;touch-action:none}

<script>
const $=s=>document.querySelector(s),NM=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],SR=44100;

 let p=P.piano,pd=false;const act=new Map(),sus=new Set();c.__w=c.__w||{};

 return{rg,set(k){p=P[k]},
